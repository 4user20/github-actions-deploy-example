name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            cd /opt/portfolio

            # Create backup
            echo "Creating database backup..."
            docker compose exec -T postgres pg_dump -U postgres portfolio_db \
              > /backups/backup-$(date +%Y%m%d-%H%M%S).sql || true

            # Login to Docker registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Tag current image as "previous" for rollback
            docker inspect ghcr.io/${{ github.repository }}:latest >/dev/null 2>&1 && \
              docker tag ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}:previous || true

            # Pull new image
            docker compose pull

            # Start services
            docker compose up -d --remove-orphans

            # Wait for app to be ready
            sleep 10

            # Run migrations
            docker compose exec -T app npm run migrate

            # Health check
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null; then
                echo "Health check passed"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health check failed - rolling back"
                docker compose down
                # Restore previous image tag
                docker tag ghcr.io/${{ github.repository }}:previous ghcr.io/${{ github.repository }}:latest
                docker compose up -d --remove-orphans
                exit 1
              fi
              sleep 2
            done

            echo "Deployment complete"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "=== Deployment Verification ==="
            echo ""
            echo "Containers:"
            docker compose ps
            echo ""
            echo "Health Check:"
            curl -sf http://localhost:3000/health && echo "--- Healthy" || echo "--- Unhealthy"
            echo ""
            echo "Recent Logs:"
            docker compose logs --tail=20 app

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "Deployment failed - initiating rollback"
            cd /opt/portfolio

            # Rollback by switching to the "previous" image tag
            docker tag ghcr.io/${{ github.repository }}:previous ghcr.io/${{ github.repository }}:latest
            docker compose up -d --remove-orphans

            echo "Rollback complete"
